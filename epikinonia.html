<!DOCTYPE html>
<html lang="el">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title id="page-title"> Επικοινωνία </title>
<style>
body {
  background-color: #800020;
  font-family: Arial;
  margin: 0;
  padding: 0;
  color: #F5F5F5;
}
.translate-box {
  float: right;
  margin: 10px;
}
.translate-box select {
  padding: 5px 10px;
  font-size: 14px;
  background: #fff;
  color: #000;
  border: 1px solid #ccc;
  border-radius: 4px;
  cursor: pointer;
}
.title {
  text-align: center;
  width: 400px;
  margin: 20px auto 0 auto;
}
.contact-form {
  width: 400px;               
  margin: 0 auto 40px auto;    
  text-align: center;            
  font-size: 1em;
}
.contact-form input[type="text"],
.contact-form input[type="email"] {
  width: 100%;
  padding: 8px;
  margin: 5px 0 15px 0;
  box-sizing: border-box;
}
.contact-form textarea {
  width: 100%;                 
  padding: 10px;               
  margin: 5px 0 15px 0;               
  font-size: 1em;
  box-sizing: border-box;
}
.contact-form input[type="submit"],
.contact-form button {
  background-color: #F5F5F5;   
  color: #800020;
  font-weight: bold;
  padding: 10px 20px;
  border: none;
  cursor: pointer;
}
.img {
  width: 200pt;
  height: 200pt;
  margin: 20px auto;
  display: block;
  text-align: center;
}
.back-link {
  color: #F5F5F5;
  font-weight: bold;
}
.owner {
  text-align: center;
  margin: 10px 0;
}
.owner a {
  color: #F5F5F5;
}
</style>
</head>
<body>
<div class="translate-box">
  <select id="langSelect" onchange="switchLanguage(this.value)">
    <option value="el">Ελληνικά</option>
    <option value="en">English</option>
  </select>
</div>

<h1 class="title" id="main-title"> Επικοινωνία </h1>
<hr>  
<div class="owner">
  <a href="../index.html" id="nav-owner">Μαίρη Κάντα</a>
</div>

<div class="contact-form">
<form>
  <label id="label-firstname" for="firstname">Όνομα:</label><br>
  <input type="text" id="firstname" name="firstname"><br>

  <label id="label-lastname" for="lastname">Επίθετο:</label><br>
  <input type="text" id="lastname" name="lastname"><br>

  <label id="label-email" for="email">E-mail:</label><br>
  <input type="email" id="email" name="email"><br>

  <label id="label-message" for="message">Μήνυμα:</label><br>
  <textarea id="message" name="message"></textarea><br>

  <input type="submit" id="submit-btn" value="Αποστολή">
</form>
</div>

<img src="xoreytis.jpg" class="img" alt="Xoreytis">
<img src="hthopoios.jpg" class="img" alt="Hthopoios">

<p align="right" style="padding-right: 20px;">
<a href="index.html" class="back-link" id="back-home"> Επιστροφή στην αρχική </a> </p>
<div style="padding-left: 20px; padding-bottom: 20px;">
<a href="../index.html" class="back-link" id="footer-owner"> Μαίρη Κάντα </a>    
</div>

<script>
  function switchLanguage(lang) {
    if (lang === 'en') {
      document.getElementById('page-title').innerText = "Contact";
      document.getElementById('nav-owner').innerText = "Mary Kanta";
      document.getElementById('main-title').innerText = "Contact";
      
      document.getElementById('label-firstname').innerText = "First Name:";
      document.getElementById('label-lastname').innerText = "Last Name:";
      document.getElementById('label-email').innerText = "E-mail:";
      document.getElementById('label-message').innerText = "Message:";
      document.getElementById('submit-btn').value = "Send";

      document.getElementById('back-home').innerText = "Back to home";
      document.getElementById('footer-owner').innerText = "Mary Kanta";
    } else {
      document.getElementById('page-title').innerText = "Επικοινωνία";
      document.getElementById('nav-owner').innerText = "Μαίρη Κάντα";
      document.getElementById('main-title').innerText = "Επικοινωνία";
      
      document.getElementById('label-firstname').innerText = "Όνομα:";
      document.getElementById('label-lastname').innerText = "Επίθετο:";
      document.getElementById('label-email').innerText = "E-mail:";
      document.getElementById('label-message').innerText = "Μήνυμα:";
      document.getElementById('submit-btn').value = "Αποστολή";

      document.getElementById('back-home').innerText = "Επιστροφή στην αρχική";
      document.getElementById('footer-owner').innerText = "Μαίρη Κάντα";
    }
  }
</script>
</body>
</html>
